<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burrow Blitz</title>

    <!-- MAIN CSS FILE -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- ================================= -->
    <!-- MEMBER 3 - SCREENS & LAYOUT AREA -->
    <!-- ================================= -->

    
    <!-- ================================= -->
    <!-- START SCREEN -->
    <!-- ================================= -->

    <section class="menu">
        <div id="startScreen" class="screen">

            <div class="main-menu-container">
                <div class="title">
                    <h1>BURROW BLITZ</h1>
                </div>

                <div class="buttons">

                    <div class="start">
                        <button id="startBtn" class=" button button-primary" onclick="startGame()">▶ Start Game</button>
                    </div>

                    <div class="options">
                        <button id="optionsBtn" class="button button-secondary" onclick="showOptions()">⚙ Options</button>
                    </div>

                    <div class="howtoplay">
                        <button id="howToPlayBtn" class="button button-tertiary" onclick="showHowToPlay()">❓ How to Play</button>
                    </div>

                    <div class="exit">
                        <button id="exitBtn" class="button button-quaternary" onclick="exitGame()">✖ Exit</button>
                    </div>

                </div>
            </div>

    </div>



    <!-- ================================= -->
    <!-- GAME SCREEN -->
    <!-- ================================= -->

    <section class="burrow-blitz-game-screen">

        <div id="gameScreen" class="screen">

            <div class="score-combo-timer">

                <div class="score">
                    <h1 id="scoreText">Score:</h1>
                    <p>0</p>
                </div>

                <div class="combo">
                    <h1 id="comboText">Combo:</h1>
                    <p>0</p>
                </div>

                <div class="timer">
                    <h1 id="timerText">Time:</h1>
                    <p>00:00</p>
                </div>

            </div>

            <div class="game">
                
                <div class="game-container">

                    <div class="grid">

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">

                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">

                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">

                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                        <div class="hole">
                            <div class="mole">
                                <h1>🐹</h1>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================================= -->
    <!-- GAME OVER SCREEN -->
    <!-- ================================= -->

    <section class="game-over">

        <div id="gameOverScreen" class="screen">

            <div class="game-over-container">

                <div class="text">
                    <h1>GAME OVER</h1>
                </div>

                <div class="message">
                    <p>You have lost the game.</p>
                </div>

                <div class="buttons">
                    <button id="retryBtn" class="button button-primary" onclick="retryGame()">Try Again</button>
                </div>

            </div>

        </div>

    </section>
